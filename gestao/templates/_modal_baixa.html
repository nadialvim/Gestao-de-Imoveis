<div class="modal fade" id="modalBaixa" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form method="post" class="modal-content" id="formBaixa">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ request.path }}">
      <div class="modal-header"><h5 class="modal-title">Dar baixa no aluguel</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button></div>
      <div class="modal-body">
        <p class="mb-3" id="baixaNome"></p>
        <label class="form-label" for="data_devolucao">Data da devolução</label>
        <input class="form-control" type="date" id="data_devolucao" name="data_devolucao" value="{{ hoje }}" required>
        <div class="form-text">O imóvel ficará disponível para nova locação.</div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-warning">Confirmar baixa</button>
      </div>
    </form>
  </div>
</div>
