<div class="card">
  <div class="card-header"><i class="bi bi-exclamation-circle me-1"></i>Pagamentos em aberto no mês</div>
  <div class="table-responsive">
    <table class="table align-middle">
      <thead><tr><th>Contrato</th><th>Vencimento</th><th class="text-end">Em aberto</th><th>Situação</th></tr></thead>
      <tbody>
        {% for p in d.pendentes %}
        <tr>
          <td>{{ p.contrato }}</td>
          <td>{{ p.vencimento|data_br }}</td>
          <td class="text-end text-money">{{ p.em_aberto|brl }}</td>
          <td>{% if p.atrasado %}<span class="badge badge-soft-danger">Atrasado</span>{% else %}<span class="badge badge-soft-warning">Pendente</span>{% endif %}</td>
        </tr>
        {% else %}
        <tr><td colspan="4"><div class="empty py-3"><i class="bi bi-check2-circle"></i>Tudo em dia.</div></td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
