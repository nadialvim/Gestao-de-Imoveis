{% extends "base.html" %}
{% block title %}Entrar — Gestão de Imóveis{% endblock %}
{% block bare %}
<div class="login-wrap">
  <div class="card login-card">
    <div class="logo"><i class="bi bi-buildings"></i></div>
    <h1 class="h4 text-center fw-bold mb-1">Gestão de Imóveis</h1>
    <p class="text-center text-muted mb-4">Acesse sua conta para continuar</p>
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}<div class="alert alert-{{ cat }} py-2" role="alert">{{ msg }}</div>{% endfor %}
    {% endwith %}
    <form method="post">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="email">E-mail</label>
        <input class="form-control" type="email" id="email" name="email" required autofocus autocomplete="username">
      </div>
      <div class="mb-4">
        <label class="form-label" for="senha">Senha</label>
        <input class="form-control" type="password" id="senha" name="senha" required autocomplete="current-password">
      </div>
      <button class="btn btn-primary w-100 py-2">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
